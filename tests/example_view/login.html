<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log In — Warung Kita POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF9F5;
    --paper-dim:#F1EFE7;
    --ink:#1E211C;
    --ink-soft:#6B7066;
    --line:#D8D4C8;
    --card:#FFFFFF;
    --green:#2F6F4F;
    --green-dark:#245A3E;
    --red:#C1272D;
    --red-bg:#FBE9E9;
    --radius:14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex; flex-direction:column;
  }
  ::selection{ background:var(--green); color:#fff; }

  .login-wrap{
    flex:1;
    display:flex; flex-direction:column; justify-content:center;
    padding:32px 24px calc(24px + var(--safe-bottom));
    padding-top:calc(48px + var(--safe-top));
  }

  .brand-block{
    text-align:center;
    margin-bottom:28px;
  }
  .brand-mark{
    width:56px; height:56px; border-radius:16px;
    background:var(--green);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Archivo Black'; font-size:1.4rem;
    margin:0 auto 14px;
  }
  .brand-title{
    font-family:'Archivo Black', sans-serif;
    font-size:1.3rem;
  }
  .brand-sub{
    font-family:'Inter'; font-weight:500; font-size:0.78rem;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft);
    margin-top:5px;
  }

  .login-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:24px 20px;
  }
  .login-heading{
    font-weight:700; font-size:1.05rem;
    margin-bottom:4px;
  }
  .login-subheading{
    font-size:0.85rem; color:var(--ink-soft);
    margin-bottom:20px;
  }

  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-weight:600; font-size:0.8rem;
    margin-bottom:6px;
  }
  .field-input-wrap{ position:relative; }
  .field-input-wrap svg{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    width:17px; height:17px; color:var(--ink-soft);
  }
  input.field-input{
    width:100%;
    background:var(--paper-dim);
    border:1.5px solid transparent;
    border-radius:12px;
    padding:12px 14px 12px 38px;
    font-family:'Inter'; font-size:0.92rem; color:var(--ink);
    outline:none;
  }
  input.field-input:focus{ border-color:var(--green); background:var(--card); }
  input.field-input::placeholder{ color:var(--ink-soft); }

  .toggle-visibility{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    border:none; background:transparent;
    color:var(--ink-soft); font-weight:600; font-size:0.72rem;
    padding:6px 8px; cursor:pointer;
  }

  .field-error{
    display:none;
    color:var(--red); font-size:0.76rem; margin-top:6px;
  }
  .field.invalid input.field-input{ border-color:var(--red); background:var(--red-bg); }
  .field.invalid .field-error{ display:block; }

  .login-btn{
    width:100%;
    background:var(--green); color:#fff;
    border:none; border-radius:999px;
    font-family:'Inter'; font-weight:700; font-size:0.95rem;
    padding:14px 10px;
    margin-top:6px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(47,111,79,0.3);
    transition:transform .1s ease, opacity .15s ease;
  }
  .login-btn:active{ transform:scale(0.98); }
  .login-btn:disabled{ opacity:0.6; cursor:not-allowed; }

  .demo-note{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem; color:var(--ink-soft);
    margin-top:18px;
    padding:10px 12px;
    background:var(--paper-dim);
    border-radius:10px;
  }

  .footer-note{
    text-align:center; font-size:0.72rem; color:var(--ink-soft);
    margin-top:20px;
  }

  @media (min-width:480px){
    .login-wrap{ max-width:400px; margin:0 auto; width:100%; }
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="brand-block">
    <div class="brand-mark">W</div>
    <div class="brand-title">Warung Kita</div>
    <div class="brand-sub">Point of Sale</div>
  </div>

  <div class="login-card">
    <div class="login-heading">Welcome back</div>
    <div class="login-subheading">Log in with your staff account to continue.</div>

    <form id="loginForm" novalidate>
      <div class="field" id="usernameField">
        <label for="username">Username or Employee ID</label>
        <div class="field-input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input type="text" class="field-input" id="username" placeholder="e.g. citra.suryani">
        </div>
        <div class="field-error">Please enter your username or employee ID.</div>
      </div>

      <div class="field" id="passwordField">
        <label for="password">Password</label>
        <div class="field-input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" class="field-input" id="password" placeholder="Enter your password">
          <button type="button" class="toggle-visibility" id="togglePw">SHOW</button>
        </div>
        <div class="field-error">Please enter your password.</div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">Log In</button>
    </form>

    <div class="demo-note">Demo mode: any username &amp; password will log you in.</div>
  </div>

  <div class="footer-note">Warung Kita POS · v1.0</div>
</div>

<script>
  const form = document.getElementById("loginForm");
  const usernameField = document.getElementById("usernameField");
  const passwordField = document.getElementById("passwordField");
  const username = document.getElementById("username");
  const password = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const togglePw = document.getElementById("togglePw");

  togglePw.addEventListener("click", ()=>{
    const isPw = password.type === "password";
    password.type = isPw ? "text" : "password";
    togglePw.textContent = isPw ? "HIDE" : "SHOW";
  });

  form.addEventListener("submit", e=>{
    e.preventDefault();
    let valid = true;

    usernameField.classList.toggle("invalid", !username.value.trim());
    passwordField.classList.toggle("invalid", !password.value.trim());
    if(!username.value.trim() || !password.value.trim()) valid = false;

    if(!valid) return;

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in…";
    setTimeout(()=>{
      window.location.href = "pos.html";
    }, 600);
  });

  [username, password].forEach(input=>{
    input.addEventListener("input", ()=>{
      input.closest(".field").classList.remove("invalid");
    });
  });
</script>

</body>
</html>
